[project]
name = "tamserve"
version = "0.0.1"
description = "Continuous batching for SAM 2-family video trackers: many cameras on one GPU."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aryaman Darda" }]
dependencies = [
    # What EdgeTAM's code imports. EdgeTAM itself is not published as a package;
    # tamserve fetches its code on first use (src/tamserve/models.py).
    "torch>=2.6",
    "torchvision>=0.18.1",
    "numpy>=1.26",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=9.4.0",
    "timm>=1.0.17",  # EdgeTAM builds its backbone with it
]

[project.urls]
Repository = "https://github.com/aryamandarda/tamserve"

[dependency-groups]
dev = ["pytest>=8"]
bench = ["psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamserve"]

[tool.pytest.ini_options]
# Not the editable install: cloud-synced folders mark its .pth file hidden and Python skips it.
pythonpath = ["src"]
testpaths = ["tests"]
