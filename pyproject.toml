[project]
name = "tamserve"
version = "0.3.3"
description = "Live, multi-camera tracking with SAM 2 and EdgeTAM, on one GPU or many: point at things or name them, and one model per GPU follows them on every camera."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aryaman Darda" }]
dependencies = [
    # What EdgeTAM's code imports. EdgeTAM itself is not published as a package;
    # tamserve fetches its code on first use (src/tamserve/models.py).
    "torch>=2.6",
    "torchvision>=0.18.1",
    "numpy>=1.26",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=9.4.0",
    "timm>=1.0.17",  # EdgeTAM builds its backbone with it
]

[project.optional-dependencies]
# Tracker and PeopleTracker find things with Meta's SAM 3: its own licence, and weights gated on Hugging Face.
# SAM 3 imports psutil without declaring it.
sam3 = ["sam3>=0.1.4", "psutil"]

[project.urls]
Repository = "https://github.com/aryamandarda/tamserve"

[project.scripts]
tamserve = "tamserve.worker:main"

[dependency-groups]
dev = ["pytest>=8", "opencv-python-headless>=4.8"]  # OpenCV: the router tests read cameras by address
bench = ["psutil", "opencv-python-headless>=4.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# SAM 3 holds NumPy below 2.4. Resolved apart from the development tools, so the tests keep
# running on the newest NumPy, which is what a plain `pip install tamserve` gets.
conflicts = [  # one pair each: in a single list, dev and bench would exclude each other too
    [{ extra = "sam3" }, { group = "dev" }],
    [{ extra = "sam3" }, { group = "bench" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/tamserve"]

[tool.hatch.build.targets.sdist]
# Everything needed to build, test and benchmark it; the demo video and GIF stay on GitHub.
only-include = ["src", "tests", "bench", "scripts", "docs/how-it-works.md", "docs/results.md", "docs/demo.md",
                "README.md", "LICENSE", "uv.lock"]

[tool.pytest.ini_options]
# Not the editable install: cloud-synced folders mark its .pth file hidden and Python skips it.
pythonpath = ["src"]
testpaths = ["tests"]
